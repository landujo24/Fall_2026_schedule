<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Norwalk Little League — 2026 Fall Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0b1d3d;
    --night-2: #122a56;
    --field: #16305e;
    --field-2: #1c3a72;
    --clay: #b7222c;
    --clay-bright: #dd3b3b;
    --chalk: #f7f5ef;
    --chalk-dim: #c6cedd;
    --amber: #dd3b3b;
    --line: rgba(247, 245, 239, 0.14);
    --line-strong: rgba(247, 245, 239, 0.24);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--night);
    color: var(--chalk);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100%;
  }

  .hero {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 12% 20%, rgba(232,162,61,0.18), transparent 40%),
      radial-gradient(circle at 85% 15%, rgba(232,162,61,0.14), transparent 35%),
      linear-gradient(180deg, var(--night) 0%, var(--night-2) 100%);
    padding: 48px 24px 32px;
    border-bottom: 1px solid var(--line);
  }
  .hero-inner { max-width: 980px; margin: 0 auto; }
  .diamond { width: 10px; height: 10px; background: var(--amber); transform: rotate(45deg); flex-shrink: 0; }
  .brand-row { display: flex; align-items: center; gap: 18px; margin-bottom: 14px; }
  .logo { height: 76px; width: auto; flex-shrink: 0; }
  h1 {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: clamp(1.5rem, 4.2vw, 2.4rem); line-height: 1.1;
    margin: 0; letter-spacing: 0.01em; color: var(--chalk);
    display: flex; flex-direction: column; gap: 2px;
  }
  h1 .season {
    font-family: 'Inter', sans-serif; font-weight: 600;
    font-size: clamp(0.85rem, 2vw, 1.05rem);
    color: var(--clay-bright); letter-spacing: 0.02em;
  }
  .hero p.sub { font-size: 1.02rem; color: var(--chalk-dim); max-width: 58ch; line-height: 1.5; margin: 0; }

  @media (max-width: 520px) {
    .logo { height: 56px; }
    .hero { padding: 26px 18px 20px; }
    .brand-row { margin-bottom: 8px; gap: 12px; }
    .hero p.sub { font-size: 0.9rem; line-height: 1.4; }
  }

  .filter-wrap {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
    background: rgba(15, 27, 45, 0.94); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .filter-bar {
    max-width: 980px; margin: 0 auto; padding: 14px 24px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .filter-label {
    font-family: 'Space Grotesk', sans-serif; font-size: 0.76rem; letter-spacing: 0.04em;
    color: var(--chalk-dim); margin-right: 6px;
  }
  .chip {
    font-family: 'Inter', sans-serif; font-size: 0.86rem; font-weight: 500;
    color: var(--chalk-dim); background: transparent; border: 1px solid var(--line-strong);
    padding: 6px 13px; border-radius: 3px; cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .chip:hover { border-color: var(--clay-bright); color: var(--chalk); }
  .chip:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .chip.active { background: var(--clay); border-color: var(--clay); color: var(--chalk); }
  .chip.all.active { background: var(--amber); border-color: var(--amber); color: var(--night); }
  .chip.events.active { background: var(--chalk); border-color: var(--chalk); color: var(--night); }

  main { max-width: 980px; margin: 0 auto; padding: 30px 24px 80px; }

  .month-nav {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }
  .sync-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 16px;
  }
  .sync-status {
    font-family: 'Inter', sans-serif; font-size: 0.78rem;
    color: var(--chalk-dim); letter-spacing: 0.01em; min-height: 1.2em;
  }
  .sync-status.error { color: var(--clay-bright); }
  .refresh-btn {
    font-family: 'Space Grotesk', sans-serif; font-size: 0.76rem; font-weight: 500;
    letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--chalk-dim); background: transparent; border: 1px solid var(--line-strong);
    padding: 6px 13px; border-radius: 3px; cursor: pointer; white-space: nowrap;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .refresh-btn:hover { border-color: var(--clay-bright); color: var(--chalk); }
  .refresh-btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .refresh-btn:disabled { opacity: 0.5; cursor: default; }
  .month-label {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 1.5rem;
    letter-spacing: 0.01em; color: var(--chalk);
  }
  .nav-btns { display: flex; gap: 6px; }
  .nav-btn {
    width: 36px; height: 36px; border-radius: 3px;
    border: 1px solid var(--line-strong); background: transparent; color: var(--chalk);
    font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: border-color 0.15s ease, background 0.15s ease, opacity 0.15s ease;
  }
  .nav-btn:hover:not(:disabled) { border-color: var(--clay-bright); background: rgba(217,138,65,0.1); }
  .nav-btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }

  .weekday-row {
    display: grid; grid-template-columns: repeat(7, 1fr);
    margin-bottom: 6px;
  }
  .weekday-row div {
    font-family: 'Space Grotesk', sans-serif; font-size: 0.72rem; letter-spacing: 0.05em;
    color: var(--chalk-dim); text-align: center; padding-bottom: 6px;
  }

  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .day-cell {
    background: linear-gradient(180deg, var(--field) 0%, var(--field-2) 100%);
    border: 1px solid var(--line);
    border-radius: 4px;
    min-height: 96px;
    padding: 7px 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .day-cell.empty-month {
    background: transparent;
    border-color: transparent;
  }
  .day-cell.today {
    border-color: var(--amber);
  }
  .day-num {
    font-family: 'Space Grotesk', sans-serif; font-size: 0.82rem; font-weight: 500;
    color: var(--chalk-dim);
    align-self: flex-start;
  }
  .day-cell.today .day-num { color: var(--amber); }
  .day-cell.has-games .day-num { color: var(--chalk); }

  .game-chip {
    font-family: 'Inter', sans-serif;
    font-size: 0.72rem;
    line-height: 1.3;
    background: rgba(232,162,61,0.1);
    border-left: 2px solid var(--clay-bright);
    border-radius: 2px;
    padding: 3px 5px;
  }
  .game-chip .t { color: var(--amber); font-weight: 600; margin-right: 4px; }
  .game-chip .m { color: var(--chalk); }
  .game-chip .l { display: block; color: var(--chalk-dim); font-size: 0.68rem; margin-top: 1px; }
  .game-chip.event-chip { border-left-color: var(--chalk-dim); background: rgba(247,245,239,0.07); }
  .game-chip.event-chip .t { color: var(--chalk); }

  .day-cell.expandable { cursor: pointer; transition: border-color 0.15s ease, transform 0.1s ease; }
  .day-cell.expandable:hover { border-color: var(--clay-bright); }
  .day-cell.expandable:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .more-tag { font-size: 0.68rem; color: var(--chalk-dim); padding-left: 5px; }

  .modal-backdrop {
    display: none;
    position: fixed; inset: 0; z-index: 100;
    background: rgba(6, 12, 25, 0.72);
    backdrop-filter: blur(3px);
    align-items: center; justify-content: center;
    padding: 24px;
  }
  .modal-backdrop.open { display: flex; }
  .modal-card {
    background: linear-gradient(180deg, var(--night-2) 0%, var(--night) 100%);
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    max-width: 440px;
    width: 100%;
    max-height: min(80vh, 640px);
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px; border-bottom: 1px solid var(--line);
  }
  .modal-title {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 1.05rem;
    color: var(--chalk);
  }
  .modal-close {
    background: transparent; border: 1px solid var(--line-strong); color: var(--chalk-dim);
    width: 30px; height: 30px; border-radius: 3px; cursor: pointer; font-size: 0.9rem;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .modal-close:hover { border-color: var(--clay-bright); color: var(--chalk); }
  .modal-close:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .modal-body {
    padding: 14px 20px 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .modal-game {
    background: linear-gradient(180deg, var(--field) 0%, var(--field-2) 100%);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 12px 14px;
  }
  .modal-game .mtime {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 0.88rem;
    color: var(--amber); margin-bottom: 4px;
  }
  .modal-game .mteams {
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.98rem;
    color: var(--chalk);
  }
  .modal-game .mloc {
    font-size: 0.84rem; color: var(--chalk-dim); margin-top: 2px;
  }
  .modal-game.event-row { background: linear-gradient(180deg, var(--night-2) 0%, var(--night) 100%); }
  .modal-game.event-row .mtime { color: var(--chalk); }

  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--chalk-dim);
    grid-column: 1 / -1;
  }
  .empty-state .diamond { margin: 0 auto 16px; }
  .empty-state p { font-size: 1rem; max-width: 40ch; margin: 0 auto; line-height: 1.5; }

  footer {
    max-width: 980px; margin: 0 auto; padding: 0 24px 50px;
    color: var(--chalk-dim); font-size: 0.82rem;
    border-top: 1px solid var(--line); padding-top: 20px;
  }

  @media (max-width: 640px) {
    .weekday-row div { font-size: 0.62rem; }
    .day-cell { min-height: 74px; padding: 5px 4px; }
    .day-num { font-size: 0.72rem; }
    .game-chip { font-size: 0.64rem; padding: 2px 3px; }
    .game-chip .l { display: none; }
    .month-label { font-size: 1.2rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

<script>
  // ---------------------------------------------------------------
  // Live source: your Google Sheet, published to the web as CSV
  // (File > Share > Publish to web > CSV). Columns expected:
  // Date, Time, Home Team, Away Team, Location.
  // ---------------------------------------------------------------
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQipw10PyKrEaG1r8o50FRFVI5Ub5BRWuVZX4czZ--7b3YBvRhhCuGJMQwuGb3c01Re87vrb3aPweQZ/pub?gid=0&single=true&output=csv";

  // Seed data shown immediately on load, before the live fetch resolves
  // (also the fallback if the fetch fails).
  // Populated live from your Google Sheet on load (see loadSchedule below).
  let GAMES = [];

  let activeTeam = "All";
  let scheduleLoaded = false;
  const EVENTS_FILTER = "__EVENTS_ONLY__";
  let viewYear, viewMonth; // 0-indexed month

  function teamList() {
    const set = new Set();
    GAMES.filter(g => g.type !== "event").forEach(g => { set.add(g.home); set.add(g.away); });
    return Array.from(set)
      .filter(t => t.toUpperCase().startsWith("NLL"))
      .sort();
  }

  function parseDate(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    return { y, m: m - 1, d };
  }

  function monthKey(y, m) { return y * 12 + m; }

  function monthsWithData() {
    const keys = new Set(GAMES.map(g => { const p = parseDate(g.date); return monthKey(p.y, p.m); }));
    return Array.from(keys).sort((a, b) => a - b);
  }

  function initView() {
    const keys = monthsWithData();
    const today = new Date();
    const todayKey = monthKey(today.getFullYear(), today.getMonth());
    let startKey = keys.length ? keys[0] : todayKey;
    // Prefer today's month if it falls within the data range, else the first month with games.
    if (keys.includes(todayKey)) startKey = todayKey;
    viewYear = Math.floor(startKey / 12);
    viewMonth = startKey % 12;
  }

  function renderChips() {
    const bar = document.getElementById("filterBar");
    bar.querySelectorAll(".chip").forEach(c => c.remove());

    const allChip = document.createElement("button");
    allChip.className = "chip all" + (activeTeam === "All" ? " active" : "");
    allChip.textContent = "All teams";
    allChip.setAttribute("aria-pressed", activeTeam === "All");
    allChip.addEventListener("click", () => { activeTeam = "All"; renderChips(); renderCalendar(); });
    bar.appendChild(allChip);

    teamList().forEach(team => {
      const chip = document.createElement("button");
      chip.className = "chip" + (activeTeam === team ? " active" : "");
      chip.textContent = team;
      chip.setAttribute("aria-pressed", activeTeam === team);
      chip.addEventListener("click", () => { activeTeam = team; renderChips(); renderCalendar(); });
      bar.appendChild(chip);
    });

    if (GAMES.some(g => g.type === "event")) {
      const eventsChip = document.createElement("button");
      eventsChip.className = "chip events" + (activeTeam === EVENTS_FILTER ? " active" : "");
      eventsChip.textContent = "Events only";
      eventsChip.setAttribute("aria-pressed", activeTeam === EVENTS_FILTER);
      eventsChip.addEventListener("click", () => { activeTeam = EVENTS_FILTER; renderChips(); renderCalendar(); });
      bar.appendChild(eventsChip);
    }
  }

  function timeToMinutes(t) {
    const m = (t || "").trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i);
    if (!m) return 0;
    let [, h, min, ap] = m;
    h = parseInt(h, 10);
    min = parseInt(min, 10);
    if (ap) {
      ap = ap.toUpperCase();
      if (ap === "PM" && h !== 12) h += 12;
      if (ap === "AM" && h === 12) h = 0;
    }
    return h * 60 + min;
  }

  function gamesForDate(iso) {
    return GAMES
      .filter(g => g.date === iso)
      .filter(g => {
        if (activeTeam === EVENTS_FILTER) return g.type === "event";
        return g.type === "event" || activeTeam === "All" || g.home === activeTeam || g.away === activeTeam;
      })
      .sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));
  }

  function renderCalendar() {
    const grid = document.getElementById("calGrid");
    grid.innerHTML = "";

    const label = new Date(viewYear, viewMonth, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });
    document.getElementById("monthLabel").textContent = label;

    const keys = monthsWithData();
    const curKey = monthKey(viewYear, viewMonth);
    document.getElementById("prevBtn").disabled = keys.length > 0 && curKey <= keys[0];
    document.getElementById("nextBtn").disabled = keys.length > 0 && curKey >= keys[keys.length - 1];

    const firstDow = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const today = new Date();
    const isCurrentMonth = today.getFullYear() === viewYear && today.getMonth() === viewMonth;

    let anyGameThisMonth = false;

    for (let i = 0; i < firstDow; i++) {
      const pad = document.createElement("div");
      pad.className = "day-cell empty-month";
      grid.appendChild(pad);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const iso = `${viewYear}-${String(viewMonth + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const dayGames = gamesForDate(iso);
      if (dayGames.length) anyGameThisMonth = true;

      const cell = document.createElement("div");
      cell.className = "day-cell" + (dayGames.length ? " has-games" : "") + (isCurrentMonth && today.getDate() === d ? " today" : "");

      const num = document.createElement("div");
      num.className = "day-num";
      num.textContent = d;
      cell.appendChild(num);

      const shown = dayGames.slice(0, 3);
      shown.forEach(g => {
        const chip = document.createElement("div");
        const isEvent = g.type === "event";
        chip.className = "game-chip" + (isEvent ? " event-chip" : "");
        const middle = isEvent ? g.home : `${g.away} @ ${g.home}`;
        chip.innerHTML = `<span class="t">${g.time ? g.time.replace(" ", "") : ""}</span><span class="m">${middle}</span><span class="l">${g.location}</span>`;
        cell.appendChild(chip);
      });
      if (dayGames.length > 3) {
        const more = document.createElement("div");
        more.className = "more-tag";
        more.textContent = `+${dayGames.length - 3} more`;
        cell.appendChild(more);
      }

      if (dayGames.length > 0) {
        cell.classList.add("expandable");
        cell.setAttribute("tabindex", "0");
        cell.setAttribute("role", "button");
        cell.setAttribute("aria-label", `${dayGames.length} game${dayGames.length > 1 ? "s" : ""} on ${iso}, view all`);
        cell.addEventListener("click", () => openDayModal(iso, dayGames));
        cell.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDayModal(iso, dayGames); }
        });
      }

      grid.appendChild(cell);
    }

    if (!anyGameThisMonth) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.innerHTML = scheduleLoaded
        ? `<div class="diamond"></div><p>No ${activeTeam === EVENTS_FILTER ? "events" : "games"} this month${(activeTeam !== "All" && activeTeam !== EVENTS_FILTER) ? " for " + activeTeam : ""}. Use the arrows above to browse other months.</p>`
        : `<div class="diamond"></div><p>Loading schedule…</p>`;
      grid.appendChild(empty);
    }
  }

  // ---------------------------------------------------------------
  // Day-detail modal (expand a cell to see every game that day)
  // ---------------------------------------------------------------
  function openDayModal(iso, dayGames) {
    const modal = document.getElementById("dayModal");
    const title = document.getElementById("modalTitle");
    const body = document.getElementById("modalBody");

    const p = parseDate(iso);
    title.textContent = new Date(p.y, p.m, p.d).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

    body.innerHTML = "";
    dayGames.forEach(g => {
      const row = document.createElement("div");
      const isEvent = g.type === "event";
      row.className = "modal-game" + (isEvent ? " event-row" : "");
      row.innerHTML = `
        <div class="mtime">${g.time || ""}</div>
        <div class="mteams">${isEvent ? g.home : `${g.away} @ ${g.home}`}</div>
        <div class="mloc">${g.location}</div>
      `;
      body.appendChild(row);
    });

    modal.classList.add("open");
  }

  function closeDayModal() {
    document.getElementById("dayModal").classList.remove("open");
  }

  document.getElementById("modalClose").addEventListener("click", closeDayModal);
  document.getElementById("dayModal").addEventListener("click", (e) => {
    if (e.target.id === "dayModal") closeDayModal();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeDayModal();
  });

  document.getElementById("prevBtn").addEventListener("click", () => {
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    renderCalendar();
  });
  document.getElementById("nextBtn").addEventListener("click", () => {
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    renderCalendar();
  });

  // ---------------------------------------------------------------
  // Live sync from the Google Sheet CSV
  // ---------------------------------------------------------------
  function parseCSV(text) {
    const lines = text.trim().split("\n").map(l => l.replace(/\r/g, ""));
    const headers = lines[0].split(",").map(h => h.trim());
    const rows = lines.slice(1).filter(l => l.length).map(line => {
      const cols = line.split(",").map(c => c.trim());
      const obj = {};
      headers.forEach((h, i) => obj[h] = cols[i] ?? "");
      return obj;
    });
    return { headers, rows };
  }

  function clean(h) { return (h || "").replace(/[^a-zA-Z0-9]/g, "").toLowerCase(); }

  function toISODate(raw) {
    const parts = (raw || "").trim().split("/");
    if (parts.length !== 3) return null;
    let [m, d, y] = parts.map(p => p.trim());
    if (y.length === 2) y = "20" + y;
    if (!m || !d || !y) return null;
    return `${y.padStart(4, "0")}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`;
  }

  async function loadSchedule() {
    const status = document.getElementById("syncStatus");
    const btn = document.getElementById("refreshBtn");
    status.textContent = "Fetching latest schedule…";
    status.classList.remove("error");
    btn.disabled = true;

    try {
      let text = null;
      let lastErr = null;

      const attempts = [
        () => fetch(CSV_URL + "&cachebust=" + Date.now(), { cache: "no-store" }),
        () => fetch("https://corsproxy.io/?" + encodeURIComponent(CSV_URL)),
        () => fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(CSV_URL)),
      ];

      for (const attempt of attempts) {
        try {
          const res = await attempt();
          if (res.ok) { text = await res.text(); break; }
        } catch (e) { lastErr = e; }
      }

      if (!text) throw new Error(lastErr?.message || "All fetch attempts failed. Make sure the sheet is published as CSV.");

      const { headers, rows } = parseCSV(text);
      if (!rows.length) throw new Error("No data rows found in sheet.");

      const dateCol = headers.find(h => clean(h).includes("date"));
      const timeCol = headers.find(h => clean(h).includes("time"));
      const homeCol = headers.find(h => clean(h).includes("home"));
      const awayCol = headers.find(h => clean(h).includes("away"));
      const locCol  = headers.find(h => clean(h).includes("location") || clean(h).includes("field"));
      const typeCol  = headers.find(h => clean(h).includes("type"));
      const titleCol = headers.find(h => clean(h).includes("title") || clean(h).includes("event"));

      if (!dateCol || !timeCol || !homeCol || !awayCol) {
        throw new Error("Could not find Date / Time / Home Team / Away Team columns.");
      }

      const parsed = rows.map(r => {
        const iso = toISODate(r[dateCol]);
        if (!iso) return null;
        const rawType = typeCol ? (r[typeCol] || "").trim().toLowerCase() : "";
        const isEvent = rawType.startsWith("event");
        const home = isEvent
          ? ((titleCol ? r[titleCol] : "") || r[homeCol] || "").trim()
          : (r[homeCol] || "").trim();
        return {
          date: iso,
          time: (r[timeCol] || "").trim(),
          home,
          away: isEvent ? "" : (r[awayCol] || "").trim(),
          location: locCol ? (r[locCol] || "").trim() : "",
          type: isEvent ? "event" : "game",
        };
      }).filter(g => g && (g.type === "event" ? g.home : (g.home && g.away)));

      if (!parsed.length) throw new Error("No valid rows found.");

      GAMES = parsed;
      scheduleLoaded = true;
      initView();
      renderChips();
      renderCalendar();

      const gameCount = GAMES.filter(g => g.type !== "event").length;
      const eventCount = GAMES.length - gameCount;
      status.textContent = `${gameCount} games${eventCount ? `, ${eventCount} events` : ""} · synced ${new Date().toLocaleTimeString()}`;
      status.classList.remove("error");
    } catch (err) {
      status.textContent = `Could not sync: ${err.message}`;
      status.classList.add("error");
      scheduleLoaded = true;
      renderCalendar();
      console.error(err);
    } finally {
      btn.disabled = false;
    }
  }

  document.getElementById("refreshBtn").addEventListener("click", loadSchedule);

  initView();
  renderChips();
  renderCalendar();
  loadSchedule();
</script>

</body>
